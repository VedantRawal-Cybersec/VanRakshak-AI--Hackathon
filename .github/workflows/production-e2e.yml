name: Production E2E

concurrency:
  group: production-e2e
  cancel-in-progress: true

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: 'Optional Railway git SHA that must be live before tests run'
        required: false
        type: string
  schedule:
    - cron: '31 4 * * *'
  push:
    paths:
      - 'tests/e2e/production-smoke.spec.js'
      - '.github/workflows/production-e2e.yml'

jobs:
  production-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BASE_URL: https://vanrakshak-api-production-3e28.up.railway.app
      PRODUCTION_E2E: '1'
      EXPECTED_SHA: ${{ inputs.expected_sha || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Wait for Railway to deploy this revision
        shell: bash
        run: |
          for i in {1..60}; do
            if curl -fsS "$BASE_URL/api/demo-scenarios" >/tmp/demo.json \
              && curl -fsS "$BASE_URL/api/build-info" >/tmp/build.json \
              && python -c "import json,os; d=json.load(open('/tmp/demo.json')); b=json.load(open('/tmp/build.json')); exp=os.getenv('EXPECTED_SHA','').strip(); ok=d.get('count')==5 and (not exp or b.get('git_sha')==exp); raise SystemExit(0 if ok else 1)"; then
              echo "Production revision is available"
              cat /tmp/build.json
              exit 0
            fi
            sleep 10
          done
          echo "Production did not expose the expected revision in time"
          exit 1
      - name: Run production smoke tests
        run: npx playwright test tests/e2e/production-smoke.spec.js --reporter=line
