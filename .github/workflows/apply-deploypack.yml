name: Apply VanRakshak deploy pack

on:
  push:
    paths:
      - '.deploypack/v2/READY'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check deploy pack
        id: check
        shell: bash
        run: |
          if [ -f .deploypack/v2/READY ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Rebuild and apply VanRakshak v2
        if: steps.check.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cat .deploypack/v2/part* > /tmp/vanrakshak-pack.b64
          base64 --decode /tmp/vanrakshak-pack.b64 > /tmp/vanrakshak-pack.zip
          mkdir -p /tmp/vanrakshak-unpack
          unzip -q /tmp/vanrakshak-pack.zip -d /tmp/vanrakshak-unpack
          test -d /tmp/vanrakshak-unpack/vanrakshak-ai
          rsync -a /tmp/vanrakshak-unpack/vanrakshak-ai/ ./
          rm -rf .deploypack
          rm -f .github/workflows/apply-deploypack.yml

      - name: Commit completed implementation
        if: steps.check.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "VanRakshak AI Bot"
          git config user.email "actions@github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Complete VanRakshak AI 37-feature production implementation"
          git push
