services:
  api:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    env_file:
      - ../.env
    ports:
      - "8000:8000"
    depends_on:
      - postgis
      - redis
  postgis:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_DB: vanrakshak
      POSTGRES_USER: vanrakshak
      POSTGRES_PASSWORD: vanrakshak_dev_only
    ports:
      - "5432:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
volumes:
  postgis_data:
