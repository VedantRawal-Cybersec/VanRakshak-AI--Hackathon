name: Railway Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'web/**'
      - 'config/**'
      - 'railway.json'
      - '.github/workflows/railway-deploy.yml'

concurrency:
  group: railway-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    container: ghcr.io/railwayapp/cli:latest
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify Railway project token
        shell: sh
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "RAILWAY_TOKEN GitHub secret is required"
            exit 1
          fi

      - name: Deploy API from this exact GitHub revision
        run: railway up --service "VanRakshak-API" --environment production --ci

      - name: Deploy worker from this exact GitHub revision
        run: railway up --service "VanRakshak-Worker" --environment production --ci

      - name: Show service status
        run: railway status --json
