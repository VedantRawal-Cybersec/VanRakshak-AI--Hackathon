name: Railway Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'web/**'
      - 'config/**'
      - 'railway.json'
      - '.github/workflows/railway-deploy.yml'

concurrency:
  group: railway-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    container: ghcr.io/railwayapp/cli:latest
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Deployment credential status
        if: ${{ env.RAILWAY_TOKEN == '' }}
        run: echo "RAILWAY_TOKEN is not configured; code validation continues but production deployment is skipped."

      - name: Deploy API from this exact GitHub revision
        if: ${{ env.RAILWAY_TOKEN != '' }}
        run: railway up --service "VanRakshak-API" --environment production --ci

      - name: Deploy worker from this exact GitHub revision
        if: ${{ env.RAILWAY_TOKEN != '' }}
        run: railway up --service "VanRakshak-Worker" --environment production --ci

      - name: Show service status
        if: ${{ env.RAILWAY_TOKEN != '' }}
        run: railway status --json
