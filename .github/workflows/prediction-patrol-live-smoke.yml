name: Prediction Patrol Live Smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'backend/app/services/prediction.py'
      - 'backend/app/services/patrol.py'
      - 'backend/app/services/remote_change.py'
      - 'backend/app/adapters/osrm.py'
      - 'backend/app/main.py'
      - 'scripts/verify_prediction_patrol_live.py'
      - '.github/workflows/prediction-patrol-live-smoke.yml'

concurrency:
  group: prediction-patrol-live-smoke
  cancel-in-progress: true

jobs:
  live-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONPATH: backend
      ALLOW_NETWORK: true
      REQUEST_TIMEOUT_S: 35
      TITILER_PUBLIC_URL: https://titiler-production-2eae.up.railway.app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - name: Verify real prediction and patrol analysis inputs
        run: python scripts/verify_prediction_patrol_live.py
