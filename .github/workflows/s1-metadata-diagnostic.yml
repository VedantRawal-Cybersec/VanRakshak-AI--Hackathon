name: Sentinel-1 Metadata Diagnostic

on:
  push:
    paths:
      - 'scripts/debug_s1_metadata.py'
      - '.github/workflows/s1-metadata-diagnostic.yml'

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python scripts/debug_s1_metadata.py
